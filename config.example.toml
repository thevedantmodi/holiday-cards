# Copy this file to config.toml and fill in your details:
#     cp config.example.toml config.toml
# config.toml is in .gitignore, so your name and address never get committed.

# ---- Front ----------------------------------------------------------------
signoff   = "WITH LOVE,"          # small spaced-out caps, top left
signature = "the Browns"          # script, next to the signoff
headline  = "MERRY CHRISTMAS"     # big serif, bottom left
dateline  = "DECEMBER 2026"       # small spaced-out caps, bottom right
border    = true                  # red double-line border around the front

# ---- Back -----------------------------------------------------------------
# Return address, top-left of the back.
sender = "The Browns"
return_address = ["1 Example Lane", "Springfield, IL 62701"]

# Short note under the small photo. Placeholders: {first_name}, {name}, {sender}.
# A "message" column in friends.csv overrides this per friend.
note = "Wishing you a merry little Christmas, {first_name}!"

# ---- Photos ---------------------------------------------------------------
# Drop your pictures in the photos/ folder with these names (or change the
# paths). Any size works: each photo is cropped to fill its spot.
[photos]
main   = "photos/main.jpg"     # large photo on the front (portrait-ish)
top    = "photos/top.jpg"      # small photo, front top-right
bottom = "photos/bottom.jpg"   # small photo, front bottom-right
back   = "photos/back.jpg"     # small photo on the back

# Optional: if a crop cuts off someone's head, say which point of the photo
# to keep in view, as [left-to-right, top-to-bottom] from 0 to 1.
[focus]
# main = [0.5, 0.3]
